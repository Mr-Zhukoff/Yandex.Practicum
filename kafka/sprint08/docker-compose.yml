    command: ["bash", "/scripts/create-topics.sh", "kafka2-1:29092,kafka2-2:29092,kafka2-3:29092"]
    networks:
      - app-net

  kafka-acls:
    image: bitnamilegacy/kafka:3.8
    container_name: marketplace-kafka-acls
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/create-acls.sh:/scripts/create-acls.sh:ro
      - ./configs/kafka/certs:/opt/bitnami/kafka/config/certs:ro
    environment:
      COMMAND_CONFIG: "/opt/bitnami/kafka/config/certs/admin-ssl.properties"
    command: ["bash", "/scripts/create-acls.sh", "kafka1:29092,kafka2:29092,kafka3:29092"]
    networks:
      - app-net

  kafka2-acls:
    image: bitnamilegacy/kafka:3.8
    container_name: marketplace-kafka2-acls
    depends_on:
      kafka2-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts/create-acls.sh:/scripts/create-acls.sh:ro
      - ./configs/kafka/certs:/opt/bitnami/kafka/config/certs:ro
    environment:
      COMMAND_CONFIG: "/opt/bitnami/kafka/config/certs/admin-ssl.properties"
    command: ["bash", "/scripts/create-acls.sh", "kafka2-1:29092,kafka2-2:29092,kafka2-3:29092"]
    networks:
      - app-net

  mirror-maker:
    image: bitnamilegacy/kafka:3.8
    container_name: marketplace-mirror-maker
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
      kafka2-acls:
        condition: service_completed_successfully
    volumes:
      - ./configs/kafka/mm2.properties:/opt/bitnami/kafka/config/mm2.properties:ro
      - ./configs/kafka/certs:/opt/bitnami/kafka/config/certs:ro
    command: ["/opt/bitnami/kafka/bin/connect-mirror-maker.sh", "/opt/bitnami/kafka/config/mm2.properties"]
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 10

  product-filter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/product-filter
    container_name: marketplace-product-filter
    profiles: ["app"]
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
    command: ["--brokers", "kafka1:29092,kafka2:29092,kafka3:29092", "--tls", "--tls-ca-cert", "/certs/ca.crt", "--tls-client-cert", "/certs/product-filter.crt", "--tls-client-key", "/certs/product-filter.key"]
    volumes:
      - ./configs/kafka/certs:/certs:ro
    networks:
      - app-net

  postgres-sink:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/postgres-sink
    container_name: marketplace-postgres-sink
    profiles: ["app"]
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - "--brokers"
      - "kafka1:29092,kafka2:29092,kafka3:29092"
      - "--tls"
      - "--tls-ca-cert"
      - "/certs/ca.crt"
      - "--tls-client-cert"
      - "/certs/postgres-sink.crt"
      - "--tls-client-key"
      - "/certs/postgres-sink.key"
      - "--database-url"
      - "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable"
    volumes:
      - ./configs/kafka/certs:/certs:ro
    networks:
      - app-net

  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/shop-api
    container_name: marketplace-shop-api
    profiles: ["jobs"]
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
    command: ["--brokers", "kafka1:29092,kafka2:29092,kafka3:29092", "--tls", "--tls-ca-cert", "/certs/ca.crt", "--tls-client-cert", "/certs/shop-api.crt", "--tls-client-key", "/certs/shop-api.key", "--file", "/data/products.json"]
    volumes:
      - ./data:/data:ro
      - ./configs/kafka/certs:/certs:ro
    networks:
      - app-net

  client-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/client-api
    container_name: marketplace-client-api
    profiles: ["jobs"]
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["search", "--brokers", "kafka1:29092,kafka2:29092,kafka3:29092", "--tls", "--tls-ca-cert", "/certs/ca.crt", "--tls-client-cert", "/certs/client-api.crt", "--tls-client-key", "/certs/client-api.key", "--database-url", "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable", "--user-id", "user_001", "--query", "умные часы"]
    volumes:
      - ./configs/kafka/certs:/certs:ro
    networks:
      - app-net

  forbidden-cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/forbidden-cli
    container_name: marketplace-forbidden-cli
    profiles: ["jobs"]
    depends_on:
      kafka-acls:
        condition: service_completed_successfully
    command: ["add", "--brokers", "kafka1:29092,kafka2:29092,kafka3:29092", "--tls", "--tls-ca-cert", "/certs/ca.crt", "--tls-client-cert", "/certs/admin.crt", "--tls-client-key", "/certs/admin.key", "--product-id", "forbidden-001", "--reason", "Seed product used to verify filtering"]
    volumes:
      - ./configs/kafka/certs:/certs:ro
    networks:
      - app-net

networks:
  app-net:
    name: marketplace-app-net

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  kafka2-1-data:
  kafka2-2-data:
  kafka2-3-data:
  postgres-data:
