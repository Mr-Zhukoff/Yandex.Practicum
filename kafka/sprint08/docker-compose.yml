      retries: 20

  kafka-init:
    image: bitnamilegacy/kafka:3.8
    container_name: marketplace-kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
      - ./configs/kafka/certs:/opt/bitnami/kafka/config/certs:ro
    environment:
      COMMAND_CONFIG: "/opt/bitnami/kafka/config/certs/admin-ssl.properties"
    command: ["bash", "/scripts/create-topics.sh", "kafka1:29092,kafka2:29092,kafka3:29092"]
    networks:
      - app-net

  kafka2-init:
    image: bitnamilegacy/kafka:3.8
    container_name: marketplace-kafka2-init
    depends_on:
      kafka2-1:
        condition: service_healthy
      kafka2-2:
        condition: service_healthy
      kafka2-3:
        condition: service_healthy
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
      - ./configs/kafka/certs:/opt/bitnami/kafka/config/certs:ro
