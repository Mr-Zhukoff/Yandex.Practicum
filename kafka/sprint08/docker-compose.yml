name: marketplace-analytics

services:
  kafka:
    image: bitnami/kafka:3.8
    container_name: marketplace-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: bitnami/kafka:3.8
    container_name: marketplace-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    command: ["bash", "/scripts/create-topics.sh", "kafka:29092"]
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./internal/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 10

  product-filter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/product-filter
    container_name: marketplace-product-filter
    profiles: ["app"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["--brokers", "kafka:29092"]
    networks:
      - app-net

  postgres-sink:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/postgres-sink
    container_name: marketplace-postgres-sink
    profiles: ["app"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - "--brokers"
      - "kafka:29092"
      - "--database-url"
      - "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable"
    networks:
      - app-net

  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/shop-api
    container_name: marketplace-shop-api
    profiles: ["jobs"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["--brokers", "kafka:29092", "--file", "/data/products.json"]
    volumes:
      - ./data:/data:ro
    networks:
      - app-net

  client-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/client-api
    container_name: marketplace-client-api
    profiles: ["jobs"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["search", "--brokers", "kafka:29092", "--database-url", "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable", "--user-id", "user_001", "--query", "умные часы"]
    networks:
      - app-net

  forbidden-cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/forbidden-cli
    container_name: marketplace-forbidden-cli
    profiles: ["jobs"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["add", "--brokers", "kafka:29092", "--product-id", "forbidden-001", "--reason", "Seed product used to verify filtering"]
    networks:
      - app-net

networks:
  app-net:
    name: marketplace-app-net

volumes:
  kafka-data:
  postgres-data:
